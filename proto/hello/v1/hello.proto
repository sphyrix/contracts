syntax = "proto3";

package hello.v1;

option go_package = "github.com/sphyrix/contracts/gen/go/hello/v1;hellov1";

// HelloService is a v0 smoke-test surface. It exists to prove the full
// contract pipeline (buf lint -> buf breaking -> proto-gen -> committed SDK
// -> go build) end to end before the first real sphyrix-hosted-service
// package (email.v1, Story 9.2) lands. Structural precedent:
// huntful-contracts/proto/hello/v1/hello.proto served the same role there.
service HelloService {
  // SayHello returns a greeting for the given name.
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
}

message SayHelloRequest {
  string name = 1;
}

message SayHelloResponse {
  string message = 1;
}
